<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Me</title>
    <link rel="stylesheet" href="portfolioform.css">
</head>

<body>

    <div class="contact-form">

        <h1>Contact Me</h1>

        <form
            action="https://formsubmit.co/ayushmauryaji0279@gmail.com"
            method="POST">

            <!-- Email Subject -->
            <input
                type="hidden"
                name="_subject"
                value="New Client Message From Portfolio">


            <!-- NAME -->

            <div class="input-box">

                <input
                    type="text"
                    name="Name"
                    placeholder="Fill Name"
                    required>

            </div>


            <!-- MOBILE NUMBER -->

            <div class="input-box">

                <input
                    type="tel"
                    name="Mobile Number"
                    placeholder="Fill Number"
                    pattern="[0-9]{10}"
                    maxlength="10"
                    required>

            </div>


            <!-- EMAIL -->

            <div class="input-box">

                <input
                    type="email"
                    name="Email"
                    placeholder="Fill Email ID"
                    required>

            </div>


            <!-- MESSAGE -->

            <div class="input-box">

                <textarea
                    name="Message"
                    placeholder="Write Message"
                    required></textarea>

            </div>


            <!-- SUBMIT -->

            <button
                type="submit"
                class="submit-btn">

                Submit

            </button>

        </form>

    </div>

</body>
</html>
